<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lattice</title>
<link rel="icon" href="/static/lattice.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="chart">
  <div id="map" aria-label="Map"></div>
</main>
<aside id="panel">
  <header class="brand">
    <img src="/static/lattice.svg" width="40" height="40" alt="">
    <div class="brand-name">
      <h1>Lattice</h1>
      <p>Space EXE<br>University of Exeter</p>
    </div>
    <span id="conn" class="pill">connecting</span>
  </header>

  <section aria-labelledby="h-source">
    <h2 id="h-source">Source</h2>
    <div class="seg" role="tablist">
      <button id="tab-replay" class="tab on" role="tab">Replay</button>
      <button id="tab-live" class="tab" role="tab">Live</button>
    </div>
    <div id="src-replay">
      <div class="fields">
        <label class="grow">Recording <select id="file"></select></label>
        <label>Chunk <span class="unit"><input id="seconds" type="number" min="1" max="60" step="1" value="5"> s</span></label>
      </div>
      <div class="transport">
        <button id="open" class="primary">Open</button>
        <button id="prev" title="Previous chunk">Back</button>
        <button id="play">Play</button>
        <button id="next" title="Next chunk">Next</button>
      </div>
      <input id="seek" type="range" min="0" max="0" value="0" disabled aria-label="Chunk">
    </div>
    <div id="src-live" hidden>
      <div class="fields">
        <label>Gain <span class="unit"><input id="gain" type="number" min="0" max="50" step="0.1" value="20"> dB</span></label>
        <label>Chunk <span class="unit"><input id="live-seconds" type="number" min="1" max="60" step="1" value="5"> s</span></label>
      </div>
      <div class="transport">
        <button id="live-start" class="primary">Start</button>
        <button id="live-stop">Stop</button>
      </div>
    </div>
    <p id="status" class="muted">idle</p>
  </section>

  <section aria-labelledby="h-fix">
    <h2 id="h-fix">Fix</h2>
    <div id="fix" class="muted">No fix yet.</div>
    <div class="track-row">
      <p id="track" class="muted small"></p>
      <button id="clear-track" class="quiet">Clear track</button>
    </div>
  </section>

  <section aria-labelledby="h-towers">
    <h2 id="h-towers">Towers</h2>
    <table id="towers">
      <thead><tr><th>Lane</th><th>Tower</th><th class="num" title="TII lit minus dark blocks">TII</th>
        <th class="num" title="Arrival after the strongest signal">Arrival</th><th class="num" title="Fix residual">Resid.</th><th class="use">Use</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="other-tii" class="muted small"></p>
  </section>

  <section aria-labelledby="h-click">
    <h2 id="h-click">Map click</h2>
    <div class="seg" id="click-mode">
      <button data-mode="none" class="tab on">Nothing</button>
      <button data-mode="truth" class="tab">True position</button>
      <button data-mode="calibrate" class="tab danger">Calibrate here</button>
    </div>
    <p id="click-help" class="muted small">Clicks on the map do nothing.</p>
    <div id="truth" class="small"></div>
    <div id="offsets" class="muted small"></div>
  </section>
</aside>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
